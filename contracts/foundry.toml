[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read", path = "./" },
  # Phase 4 demo only: script/DeployDemo.s.sol writes deployed contract addresses here so
  # scripts/demo-driver.ts can read them back. Never used by any test or by anything that
  # touches a real network.
  { access = "read-write", path = "./.fork-state" },
]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[lint]
# reentrancy-no-eth / reentrancy-events: StewardAccount's only external calls are to
# immutable, trusted-at-construction contracts (its own adapter and ConductRegistry, wired
# by the factory, never arbitrary caller-supplied addresses), and every state-changing
# function that makes such a call is guarded by OpenZeppelin's nonReentrant. The residual
# risk these two lints flag (a trusted dependency doing something unexpected mid-call) is
# accepted and documented in docs/THREAT_MODEL.md, not fixed per-callsite with ~8 repeated
# inline suppressions that would carry no additional information.
exclude_lints = ["reentrancy-no-eth", "reentrancy-events"]

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
